[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskman"
version = "0.1.0"
description = "Smart Task Manager with Auto-Scheduling"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "schedule>=1.2.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "requests>=2.31.0",
    "textual>=0.44.0",
]

[project.scripts]
task = "taskman.client.cli:cli"
task-server = "taskman.server.main:start_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskman*"]
