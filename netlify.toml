# Netlify configuration for TrackMind

[build]
  # Build command for the entire monorepo
  # Enable corepack for pnpm, then install and build
  command = "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm run build"
  # Publish directory (web app output)
  publish = "packages/web/dist"
  # Functions directory
  functions = "functions"

# Development settings
[dev]
  command = "pnpm --filter @trackmind/web dev"
  targetPort = 5173
  port = 8888
  publish = "packages/web/dist"
  autoLaunch = true

# Environment variables for build
[build.environment]
  NODE_VERSION = "20"
  # Force Netlify to use pnpm instead of npm
  NPM_FLAGS = "--version"
  # Enable pnpm via corepack
  COREPACK_ENABLE_STRICT = "0"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GitHub OAuth function configuration
[functions."oauth"]
  node_bundler = "esbuild"

# Google OAuth function configuration
[functions."google-oauth"]
  node_bundler = "esbuild"
